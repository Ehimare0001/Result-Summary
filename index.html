<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results Summary Component</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="box">

        <div class="result_summary">


            <div class="result_summary_left">

                <p class="your_result">Your Result</p>

                <div class="result_score">

                    <h1>76</h1>
                    <p>of 100</p>

                </div>

                <h2>Great</h2>

                <p class="result_text">
                    You scored higher than 65% of the people
                    who have taken these tests.
                </p>

            </div>



            <div class="result_summary_right">

                <h2>Summary</h2>

                <div class="summary_table">

                    <div class="reaction">

                        <h4>Reaction</h4>
                        <p><span>80</span> / 100</p>

                    </div>


                    <div class="memory">

                        <h4>Memory</h4>
                        <p><span>92</span> / 100</p>

                    </div>


                    <div class="verbal">

                        <h4>Verbal</h4>
                        <p><span>61</span> / 100</p>

                    </div>


                    <div class="visual">

                        <h4>Visual</h4>
                        <p><span>72</span> / 100</p>

                    </div>

                </div>


                <button>Continue</button>

            </div>

        </div>

    </div>

</body>

</html>
